<!-- Blues AI Logo - Dark Theme Variant -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Main gradient for outer ring - dark theme -->
    <linearGradient id="gradient1-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.6"/>
    </linearGradient>
    
    <!-- Middle ring gradient - dark theme -->
    <linearGradient id="gradient2-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#c7d2fe;stop-opacity:0.8"/>
    </linearGradient>
    
    <!-- Core gradient - dark theme -->
    <linearGradient id="gradient3-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c7d2fe"/>
      <stop offset="100%" style="stop-color:#f8fafc"/>
    </linearGradient>
    
    <!-- Enhanced core gradient for depth - dark theme -->
    <radialGradient id="coreGradient-dark" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="20%" style="stop-color:#f8fafc;stop-opacity:0.98"/>
      <stop offset="40%" style="stop-color:#e2e8f0;stop-opacity:0.95"/>
      <stop offset="70%" style="stop-color:#c7d2fe"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </radialGradient>
    
    <!-- Outer glow gradient - dark theme -->
    <radialGradient id="outerGlow-dark" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0"/>
      <stop offset="70%" style="stop-color:#8b5cf6;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.4"/>
    </radialGradient>
    
    <!-- Glow effect - enhanced for dark theme -->
    <filter id="glow-dark" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Drop shadow - enhanced for dark theme -->
    <filter id="dropshadow-dark" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#8b5cf6" flood-opacity="0.6"/>
    </filter>
    
    <!-- Inner shadow -->
    <filter id="innerShadow-dark" x="-50%" y="-50%" width="200%" height="200%">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="4" result="offset-blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.15"/>
      <feComposite in2="offset-blur" operator="in"/>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer glow background -->
  <circle cx="256" cy="256" r="250" fill="url(#outerGlow-dark)"/>
  
  <!-- Background circle with subtle glow -->
  <circle cx="256" cy="256" r="240" fill="url(#gradient1-dark)" opacity="0.3" filter="url(#glow-dark)"/>
  
  <!-- Secondary ring -->
  <circle cx="256" cy="256" r="200" fill="url(#gradient1-dark)" opacity="0.2"/>
  
  <!-- Middle ring -->
  <circle cx="256" cy="256" r="180" fill="url(#gradient2-dark)" opacity="0.4"/>
  
  <!-- Inner ring with enhanced styling -->
  <circle cx="256" cy="256" r="120" fill="url(#coreGradient-dark)" filter="url(#dropshadow-dark)"/>
  
  <!-- Central core with highlight -->
  <circle cx="256" cy="256" r="70" fill="url(#gradient3-dark)" filter="url(#innerShadow-dark)"/>
  
  <!-- Inner core -->
  <circle cx="256" cy="256" r="45" fill="url(#coreGradient-dark)" opacity="0.9"/>
  
  <!-- Highlight dot for depth -->
  <circle cx="236" cy="236" r="16" fill="#ffffff" opacity="0.8"/>
  <circle cx="240" cy="240" r="8" fill="#ffffff" opacity="0.95"/>
  
  <!-- Subtle inner glow rings -->
  <circle cx="256" cy="256" r="50" fill="none" stroke="url(#gradient3-dark)" stroke-width="2" opacity="0.5"/>
  <circle cx="256" cy="256" r="35" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  
  <!-- Additional depth elements -->
  <circle cx="256" cy="256" r="90" fill="none" stroke="url(#gradient2-dark)" stroke-width="1" opacity="0.3"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#gradient1-dark)" stroke-width="1" opacity="0.15"/>
</svg>